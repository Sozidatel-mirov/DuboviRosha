<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель врача | Курс процедур</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .procedure-item { background: #f8fafc; border-radius: 16px; padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .course-summary { background: #e8f4f0; border-radius: 16px; padding: 16px; margin-top: 16px; }
    .time-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .time-row input { width: auto; margin-bottom: 0; }
    .print-btn { background: #2c5a6e; }
    .preview-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .preview-table th, .preview-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .selected-patient { background: #e8f4f0; padding: 12px; border-radius: 16px; margin-bottom: 16px; font-weight: 500; }
  </style>
</head>
<body>
<div class="container">
  <div class="navbar">
    <a href="/dashboard.html"><i class="fas fa-home"></i> Главная</a>
    <a href="/calendar.html"><i class="fas fa-calendar-alt"></i> Календарь</a>
    <a href="/reports.html"><i class="fas fa-chart-line"></i> Отчёты</a>
    <span class="user-info" id="doctorInfo"></span>
  </div>
  <div class="grid-3" id="doctorStats"></div>
  <div class="card">
    <h2><i class="fas fa-users"></i> Мои пациенты</h2>
    <div style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap;">
      <div style="flex:1;"><label><i class="fas fa-search"></i> Поиск пациента</label><input type="text" id="patientSearch" placeholder="ФИО, диагноз, телефон или email..."></div>
      <button id="clearSearchBtn" class="btn-outline"><i class="fas fa-times"></i> Сбросить</button>
    </div>
    <button id="newPatientBtn" style="margin-bottom: 16px;"><i class="fas fa-user-plus"></i> Новый пациент</button>
    <div style="overflow-x: auto;">
      <table id="patientsTable">
        <thead><tr><th>ФИО</th><th>Диагноз</th><th>Действия</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Модальное окно курса процедур -->
<div id="courseModal" class="modal-overlay">
  <div class="modal-window" style="max-width: 1100px;">
    <h3><i class="fas fa-calendar-plus"></i> Назначить курс процедур</h3>
    <div class="selected-patient" id="selectedPatientInfo"></div>
    <input type="hidden" id="coursePatientId">
    <div id="modalProceduresList"><p style="color:#8ba0ae;"><i class="fas fa-info-circle"></i> Нет добавленных процедур. Нажмите "Добавить процедуру".</p></div>
    <button id="modalAddProcedureBtn" style="width:100%; margin-bottom:16px;"><i class="fas fa-plus"></i> Добавить процедуру</button>
    <div style="border-top:1px solid #e2e8f0; padding-top:16px; margin-top:8px;">
      <label><i class="fas fa-calendar-day"></i> Дата начала курса</label><input type="date" id="modalCourseStartDate">
      <div class="time-row"><label><i class="fas fa-clock"></i> Время начала (первый сеанс)</label><input type="time" id="modalCourseStartTime" value="09:00" step="300"></div>
      <label><i class="fas fa-calendar-week"></i> Интервал между днями (дней)</label><select id="modalIntervalDays"><option value="1">Каждый день</option><option value="2">Через день</option><option value="3">Каждые 3 дня</option><option value="7">Раз в неделю</option></select>
      <label><i class="fas fa-hourglass-half"></i> Интервал между процедурами в один день (минут)</label><input type="number" id="modalIntervalMinutes" value="10" min="0" step="5">
      <label><i class="fas fa-calendar-times"></i> Исключать выходные</label><select id="modalExcludeWeekends"><option value="false">Нет</option><option value="true">Да</option></select>
    </div>
    <button id="modalGenerateScheduleBtn" style="width:100%; margin-top:20px; background:#2c9b7a;"><i class="fas fa-chalkboard"></i> Сформировать расписание</button>
    <div id="modalSchedulePreview" class="course-summary" style="display:none;">
      <h4><i class="fas fa-eye"></i> Предпросмотр расписания</h4>
      <div style="overflow-x: auto;"><div id="modalPreviewList"></div></div>
      <div class="modal-buttons" style="margin-top: 12px;">
        <button id="modalConfirmScheduleBtn" style="background:#1a6d5e;"><i class="fas fa-save"></i> Подтвердить и сохранить</button>
        <button id="modalPrintScheduleBtn" class="print-btn"><i class="fas fa-print"></i> Распечатать</button>
        <button id="modalCancelPreviewBtn" class="btn-outline"><i class="fas fa-times"></i> Отмена</button>
      </div>
    </div>
    <div class="modal-buttons" style="margin-top:16px;"><button class="btn-outline" onclick="closeCourseModal()"><i class="fas fa-times"></i> Закрыть</button></div>
  </div>
</div>

<!-- Модальное окно медицинской карты -->
<div id="medicalCardModal" class="modal">
  <div class="modal-content">
    <h2><i class="fas fa-notes-medical"></i> Медицинская карта</h2>
    <div id="modalContent"></div>
    <div class="modal-buttons">
      <button onclick="closeModal()"><i class="fas fa-times"></i> Закрыть</button>
    </div>
  </div>
</div>

<!-- Модальное окно для пациента (расширенное) -->
<div id="patientModal" class="modal-overlay">
  <div class="modal-window">
    <h3 id="patientModalTitle"><i class="fas fa-user-plus"></i> Новый пациент</h3>
    <input type="hidden" id="patientId">
    <div class="form-row"><label><i class="fas fa-user"></i> ФИО *</label><input type="text" id="patientName" required></div>
    <div class="form-row">
      <label><i class="fas fa-venus-mars"></i> Пол</label>
      <select id="patientGender"><option value="">Не указан</option><option value="М">Мужской</option><option value="Ж">Женский</option></select>
    </div>
    <div class="form-row">
      <label><i class="fas fa-birthday-cake"></i> Дата рождения</label><input type="date" id="patientBirthDate">
    </div>
    <div class="form-row">
      <label><i class="fas fa-phone"></i> Телефон</label>
      <input type="text" id="patientPhone">
    </div>
    <div class="form-row">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="patientEmail">
    </div>
    <div class="form-row">
      <label><i class="fas fa-stethoscope"></i> Диагноз</label>
      <textarea id="patientDiagnosis" rows="2"></textarea>
    </div>
    <div class="form-row">
      <label><i class="fas fa-history"></i> История болезни</label>
      <textarea id="patientHistory" rows="3"></textarea>
    </div>
    <div class="form-row">
      <label><i class="fas fa-allergies"></i> Аллергии</label>
      <input type="text" id="patientAllergies">
    </div>
    <div class="form-row"><label><i class="fas fa-tint"></i> Группа крови</label><input type="text" id="patientBloodType"></div>
    <div class="form-row">
      <label><i class="fas fa-weight"></i> Вес (кг)</label>
      <input type="number" id="patientWeight" step="0.1">
    </div>
    <div class="form-row">
      <label><i class="fas fa-arrow-up"></i> Рост (см)</label>
      <input type="number" id="patientHeight">
    </div>
    <div class="form-row"><label><i class="fas fa-briefcase"></i> Профессия</label><input type="text" id="patientOccupation"></div>
    <div class="form-row"><label><i class="fas fa-heart"></i> Семейное положение</label><input type="text" id="patientMaritalStatus"></div>
    <div class="form-row"><label><i class="fas fa-phone-alt"></i> Экстренный контакт</label><input type="text" id="patientEmergencyContact"></div>
    <div class="form-row"><label><i class="fas fa-file-invoice"></i> Полис ДМС</label><input type="text" id="patientInsurancePolicy"></div>
    <div class="form-row"><label><i class="fas fa-syringe"></i> Прививки</label><textarea id="patientVaccinations" rows="2"></textarea></div>
    <div class="form-row"><label><i class="fas fa-lungs"></i> Хронические заболевания</label><textarea id="patientChronicDiseases" rows="2"></textarea></div>
    <div class="modal-buttons"><button class="btn-outline" onclick="closePatientModal()"><i class="fas fa-times"></i> Отмена</button><button id="savePatientBtn"><i class="fas fa-save"></i> Сохранить</button></div>
  </div>
</div>

<!-- Модальное окно для выбора процедуры -->
<div id="addProcedureModal" class="modal-overlay">
  <div class="modal-window">
    <h3><i class="fas fa-plus-circle"></i> Добавить процедуру в курс</h3>
    <div class="form-row">
      <label><i class="fas fa-procedures"></i> Процедура</label>
      <select id="modalProcedureSelect"><option value="">-- Выберите процедуру --</option></select>
    </div>
    <div class="form-row">
      <label><i class="fas fa-sort-numeric-up"></i> Количество сеансов</label>
      <input type="number" id="modalSessionsCount" value="5" min="1">
    </div>
    <div class="form-row">
      <label><i class="fas fa-hourglass-start"></i> Длительность одного сеанса (минут)</label>
      <input type="number" id="modalDuration" value="30" min="5" step="5">
    </div>
    <div class="modal-buttons">
      <button class="btn-outline" onclick="closeAddProcedureModal()"><i class="fas fa-times"></i> Отмена</button>
      <button id="confirmAddProcedureBtn"><i class="fas fa-check"></i> Добавить</button>
    </div>
  </div>
</div>

<!-- Модальное окно для редактирования назначения -->
<div id="editAppointmentModal" class="modal-overlay">
  <div class="modal-window">
    <h3><i class="fas fa-edit"></i> Редактировать назначение</h3>
    <input type="hidden" id="editAppointmentId">
    <div class="form-row"><label><i class="fas fa-procedures"></i> Процедура</label><select id="editAppointmentProcedureId"></select></div>
    <div class="form-row"><label><i class="fas fa-calendar-alt"></i> Дата</label><input type="date" id="editAppointmentDate"></div>
    <div class="form-row"><label><i class="fas fa-clock"></i> Время</label><input type="time" id="editAppointmentTime" step="300"></div>
    <div class="form-row"><label><i class="fas fa-door-open"></i> Ресурс (кабинет)</label><select id="editAppointmentResourceId"></select></div>
    <div class="form-row"><label><i class="fas fa-flag-checkered"></i> Статус</label>
      <select id="editAppointmentStatus"><option value="Назначена">Назначена</option><option value="Выполнена">Выполнена</option><option value="Не явился">Не явился</option></select>
    </div>
    <div class="form-row"><label><i class="fas fa-comment"></i> Комментарий</label><textarea id="editAppointmentComment" rows="2"></textarea></div>
    <div class="modal-buttons">
      <button class="btn-outline" onclick="closeEditAppointmentModal()"><i class="fas fa-times"></i> Отмена</button>
      <button id="saveAppointmentEditBtn"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/doctor.js"></script>
</body>
</html>
