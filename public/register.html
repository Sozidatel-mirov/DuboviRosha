<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация пациента</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container" style="max-width: 500px; margin: 40px auto;">
  <div class="card">
    <h2><i class="fas fa-user-plus"></i> Регистрация нового пациента</h2>

    <!-- Единая форма регистрации -->
    <div id="registrationForm">
      <div class="form-row"><label><i class="fas fa-envelope"></i> Email *</label><input type="email" id="regEmail" placeholder="example@mail.ru" required></div>
      <div class="form-row"><label><i class="fas fa-user"></i> ФИО *</label><input type="text" id="fullName" required></div>
      <div class="form-row"><label><i class="fas fa-venus-mars"></i> Пол</label><select id="gender"><option value="М">Мужской</option><option value="Ж">Женский</option></select></div>
      <div class="form-row"><label><i class="fas fa-birthday-cake"></i> Дата рождения</label><input type="date" id="birthDate"></div>
      <div class="form-row"><label><i class="fas fa-phone"></i> Телефон</label><input type="tel" id="phone" placeholder="+7 123 456-78-90"></div>
      <div class="form-row"><label><i class="fas fa-lock"></i> Пароль *</label><input type="password" id="password" required></div>
      <div class="form-row"><label><i class="fas fa-check-circle"></i> Подтверждение пароля *</label><input type="password" id="password2" required></div>
      <button id="completeRegBtn" class="btn"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
      <div id="regError" style="color:red; margin-top:10px;"></div>
    </div>

    <div class="step-link">
      <a href="/"><i class="fas fa-sign-in-alt"></i> Уже есть аккаунт? Войти</a>
    </div>
  </div>
</div>
<script src="/js/register.js"></script>
</body>
</html>
