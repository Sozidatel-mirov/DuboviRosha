<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дашборд | Медицинская система</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
  <div class="navbar" id="navbar"></div>
  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
  <div class="grid-3" id="statsCards"></div>
  <div class="card">
    <h2><i class="fas fa-bolt"></i> Быстрые действия</h2>
    <div id="quickActions" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
  </div>
  <div class="card">
    <h2><i class="fas fa-history"></i> Последние назначения</h2>
    <div id="recentAppointments"></div>
  </div>
  <div class="card">
    <h2><i class="fas fa-bell"></i> Уведомления</h2>
    <div id="notificationsList"></div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/menu.js"></script>
</body>
</html>
